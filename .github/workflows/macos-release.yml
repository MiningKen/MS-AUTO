name: Build macOS release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/macos-release.yml]

permissions:
  contents: write

jobs:
  macos-dmg:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Add Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install dependencies
        run: npm ci
      - name: Test and lint
        run: |
          npm test
          npm run lint
      - name: Build universal macOS DMG
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg
      - name: Attach DMG to v0.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.1.0 src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
